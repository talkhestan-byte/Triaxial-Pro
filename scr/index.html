<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمایش سه‌محوری</title><style>
body{font:14px Tahoma,sans-serif;margin:0;background:#f3f4f6;color:#111}
.c{background:#fff;margin:8px;padding:8px;border-radius:8px}h3{margin:0 0 6px;font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.g label{display:flex;justify-content:space-between;align-items:center;gap:4px}
input,select{width:88px;padding:3px;font:inherit;border:1px solid #bbb;border-radius:4px;text-align:center;box-sizing:border-box}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:2px;text-align:center;font-size:13px}
td input{width:100%;min-width:60px}.sc{overflow:auto;max-height:55vh}
th{position:sticky;top:0;background:#e8eef7;z-index:2}td:first-child,th:first-child{position:sticky;right:0;background:#e8eef7;z-index:3;width:46px}th:first-child{z-index:4}
canvas{width:100%;display:block;margin-top:6px}button{padding:8px 14px;margin:4px;border:0;border-radius:6px;background:#1976d2;color:#fff;font:inherit}button.s{background:#555;padding:4px 8px}
input:disabled{background:#ddd}.r{font-size:12px}
</style></head><body><div id="app"></div><script>
const $=i=>document.getElementById(i),G=9.80665,KC=98.0665,COL=['#d32f2f','#1976d2','#2e7d32'];
const ROWS=[.1,.2,.3,.4,.5,.75,1,1.5,2,2.5,3,4,5,6,7,8,9,10];
const num=s=>{s=String(s==null?'':s).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٫,\/]/g,'.');const v=parseFloat(s);return isFinite(v)?v:NaN};
const f=(v,d=2)=>isFinite(v)?(+v.toFixed(d)).toString():'—';
const KEY='triax_v1';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{info:{},unit:'kPa',method:'UU',dev:{type:'ring',ring:0},rings:[{n:'رینگ ۱',k:1,u:'kg',r:1}],ld:{u:'kg',r:.1},com:{},sp:[{},{},{}],rd:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const gp=(p)=>p.split('|').reduce((o,k)=>o&&o[k],S),sp_=(p,v)=>{const a=p.split('|'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const uo=v=>S.unit==='kPa'?v:v/KC,fp=v=>f(uo(v),S.unit==='kPa'?1:3);

/* ===== Methods registry: add CU / CD later by registering here ===== */
const METHODS={UU:{title:'سه‌محوری UU (تحکیم‌نیافته-زهکشی‌نشده)',calc:calcUU,charts:[chartSS,chartMohr]}};

function calcUU(){
 const dv=S.dev,rg=dv.type==='ring'?(S.rings[dv.ring]||S.rings[0]):null;
 const k=rg?num(rg.k):1,fu=rg?rg.u:S.ld.u,res=rg?num(rg.r):num(S.ld.r),fm=fu==='kg'?G:fu==='kN'?1000:1,pk=S.unit==='kPa'?1:KC;
 const sp=[0,1,2].map(i=>{const p=S.sp[i],D=num(p.D)||num(S.com.D),H=num(p.H)||num(S.com.H),s3=num(p.s3)*pk,m=num(p.m),w=num(p.w),Gs=num(S.com.Gs);
  const A0=Math.PI*D*D/4,pts=[];
  if(D&&H)ROWS.forEach(dl=>{let rd=num(S.rd[dl+'_'+i]);if(isNaN(rd)||dl/H>.13+1e-9)return;
   if(res>0)rd=Math.round(rd/res)*res;const e=dl/H,P=rd*k*fm,sd=P/(A0/(1-e))*1000;pts.push({dl,e,P,sd})});
  const pk_=pts.reduce((a,b)=>!a||b.sd>a.sd?b:a,null),o={D,H,s3,pts,pk:pk_,w};
  const V=A0*H/1000;if(m&&V){o.g=m/V;if(w>=0){o.gd=o.g/(1+w/100);if(Gs){o.e=Gs/o.gd-1;o.S=w*Gs/o.e}}}
  if(pk_&&isFinite(s3)){o.sdf=pk_.sd;o.s1=s3+pk_.sd;o.su=pk_.sd/2;o.p=s3+pk_.sd/2;o.q=pk_.sd/2}return o});
 const ok=sp.filter(s=>s.q!=null),n=ok.length,R={sp,fu,rg,c:NaN,phi:NaN};
 if(n){const mx=ok.reduce((a,s)=>a+s.p,0)/n,my=ok.reduce((a,s)=>a+s.q,0)/n;let sxx=0,sxy=0;ok.forEach(s=>{sxx+=(s.p-mx)**2;sxy+=(s.p-mx)*(s.q-my)});
  let m=n>1&&sxx>0?sxy/sxx:0,a=my-m*mx;if(m<0){m=0;a=my}m=Math.min(m,.999);R.phi=Math.asin(m);R.c=a/Math.cos(R.phi);R.a=a;R.alpha=Math.atan(m)}
 return R}

/* ===== Charts (shared by screen and print sheet) ===== */
function nice(m,n=6){const r=m/n,p=Math.pow(10,Math.floor(Math.log10(r))),b=r/p;return(b<=1?1:b<=2?2:b<=5?5:10)*p}
function base(c,x,y,w,h,F,title,xl,yl,xm,ym,eq){
 const L=F*4.4,B=F*3,T=F*2.4,px=x+L,py=y+T,pw=w-L-F,ph=h-T-B;
 if(eq){const s=Math.min(pw/xm,ph/ym);xm=pw/s;ym=ph/s}
 const X=v=>px+v/xm*pw,Y=v=>py+ph-v/ym*ph,dx=nice(xm),dy=nice(ym);
 c.save();c.font=F+'px Tahoma';c.lineWidth=.6;c.strokeStyle='#bbb';c.fillStyle='#000';c.textAlign='center';c.direction='ltr';
 for(let v=0;v<=xm+1e-9;v+=dx){c.beginPath();c.moveTo(X(v),py);c.lineTo(X(v),py+ph);c.stroke();c.fillText(f(v,2),X(v),py+ph+F*1.2)}
 c.textAlign='right';for(let v=0;v<=ym+1e-9;v+=dy){c.beginPath();c.moveTo(px,Y(v));c.lineTo(px+pw,Y(v));c.stroke();c.fillText(f(v,2),px-3,Y(v)+F/3)}
 c.strokeStyle='#000';c.lineWidth=1.2;c.strokeRect(px,py,pw,ph);c.textAlign='center';c.direction='rtl';c.font='bold '+F+'px Tahoma';
 c.fillText(title,x+w/2,y+F*1.2);c.font=F+'px Tahoma';c.fillText(xl,px+pw/2,y+h-F*.4);
 c.translate(x+F*.9,py+ph/2);c.rotate(-Math.PI/2);c.fillText(yl,0,0);c.restore();return{X,Y,px,py,pw,ph,xm,ym}}
function legend(c,b,R,F){c.save();c.font=F+'px Tahoma';c.textAlign='left';c.direction='ltr';
 R.sp.forEach((s,i)=>{const yy=b.py+F*1.4*(i+1);c.strokeStyle=c.fillStyle=COL[i];c.lineWidth=2;c.beginPath();c.moveTo(b.px+b.pw-F*9,yy);c.lineTo(b.px+b.pw-F*7,yy);c.stroke();c.fillText('#'+(i+1)+'  σ3='+fp(s.s3)+' '+S.unit,b.px+b.pw-F*6.7,yy+F/3)});c.restore()}
function chartSS(c,x,y,w,h,R,F){
 let xm=1,ym=1;R.sp.forEach(s=>s.pts.forEach(p=>{xm=Math.max(xm,p.e*100);ym=Math.max(ym,uo(p.sd))}));
 const b=base(c,x,y,w,h,F,'منحنی تنش انحرافی - کرنش','کرنش محوری ε (%)','σd ('+S.unit+')',Math.ceil(xm),ym*1.08);
 R.sp.forEach((s,i)=>{if(!s.pts.length)return;c.strokeStyle=c.fillStyle=COL[i];c.lineWidth=1.8;c.beginPath();
  s.pts.forEach((p,j)=>{const X=b.X(p.e*100),Y=b.Y(uo(p.sd));j?c.lineTo(X,Y):c.moveTo(X,Y)});c.stroke();
  s.pts.forEach(p=>{c.beginPath();c.arc(b.X(p.e*100),b.Y(uo(p.sd)),2,0,7);c.fill()})});legend(c,b,R,F)}
function chartMohr(c,x,y,w,h,R,F){
 const ok=R.sp.filter(s=>s.q!=null);let xm=1,ym=1;ok.forEach(s=>{xm=Math.max(xm,uo(s.s1));ym=Math.max(ym,uo(s.q))});
 if(isFinite(R.c))ym=Math.max(ym,uo(R.c));
 const b=base(c,x,y,w,h,F,'دایره‌های موهر و پوش گسیختگی','σ ('+S.unit+')','τ ('+S.unit+')',xm*1.06,ym*1.25,true);
 ok.forEach((s,i)=>{const j=R.sp.indexOf(s);c.strokeStyle=COL[j];c.lineWidth=1.8;c.beginPath();c.arc(b.X(uo(s.p)),b.Y(0),uo(s.q)/b.xm*b.pw,Math.PI,2*Math.PI);c.stroke();
  c.fillStyle=COL[j];c.beginPath();c.arc(b.X(uo(s.p)),b.Y(uo(s.q)),2.5,0,7);c.fill()});
 if(isFinite(R.c)){const t=Math.tan(R.phi),cc=uo(R.c),X0=b.X(0),Y0=b.Y(cc);c.strokeStyle='#000';c.lineWidth=1.6;c.beginPath();c.moveTo(X0,Y0);c.lineTo(b.X(b.xm),b.Y(cc+b.xm*t));c.stroke();
  c.setLineDash([4,3]);c.lineWidth=.9;c.beginPath();c.moveTo(X0,Y0);c.lineTo(b.X(b.xm),Y0);c.stroke();c.setLineDash([]);
  const r=F*5;c.beginPath();c.arc(X0,Y0,r,0,-R.phi,true);c.stroke();c.fillStyle='#000';c.beginPath();c.arc(X0,Y0,3.5,0,7);c.fill();
  c.font='bold '+F+'px Tahoma';c.direction='ltr';c.textAlign='left';c.fillText('c = '+f(cc,S.unit==='kPa'?1:3)+' '+S.unit,X0+F*.6,Y0-F*.9-(R.phi>.1?F*0:0));
  c.fillText('φ = '+f(R.phi*180/Math.PI,1)+'°',X0+r+F*.5,Y0+F*1.4)}legend(c,b,R,F)}

/* ===== UI ===== */
const inp=(p,l,w)=>`<label>${l}<input data-p="${p}" inputmode="decimal" value="${gp(p)??''}" style="width:${w||88}px"></label>`;
const sel=(p,l,o,r)=>`<label>${l}<select data-p="${p}" ${r?'data-r=1':''}>${o.map(([v,t])=>`<option value="${v}" ${gp(p)==v?'selected':''}>${t}</option>`).join('')}</select></label>`;
function render(){
 const dv=S.dev,ri=dv.ring=Math.min(dv.ring,S.rings.length-1),ring=dv.type==='ring',U=[['kg','kg'],['kN','kN'],['N','N']];
 const rows=[['s3','σ3 فشار جانبی ('+S.unit+')'],['D','قطر (mm)'],['H','ارتفاع (mm)'],['m','وزن مرطوب (g)'],['w','رطوبت (%)']];
 $('app').innerHTML=`<div class=c><h3>${METHODS[S.method].title}</h3><div class=g>
 ${inp('info|proj','پروژه')}${inp('info|id','شناسه نمونه')}${inp('info|date','تاریخ')}${inp('info|op','آزمایشگر')}
 ${sel('unit','واحد فشار',[['kPa','kPa'],['kg/cm²','kg/cm²']],1)}${sel('method','روش',Object.keys(METHODS).map(k=>[k,k]),1)}</div></div>
 <div class=c><h3>دستگاه بارگذاری</h3><div class=g>${sel('dev|type','نوع',[['ring','آنالوگ (رینگ)'],['cell','لودسل دیجیتال']],1)}
 ${ring?sel('dev|ring','رینگ',S.rings.map((r,i)=>[i,r.n]),1)+inp(`rings|${ri}|n`,'نام رینگ')+inp(`rings|${ri}|k`,'ضریب رینگ (به‌ازای هر div)')+sel(`rings|${ri}|u`,'واحد ضریب',U)+inp(`rings|${ri}|r`,'دقت قرائت (div)')
 +`<label><button class=s data-a=add>+ رینگ</button><button class=s data-a=del>حذف</button></label>`
 :sel('ld|u','واحد نیرو',U)+inp('ld|r','دقت (واحد نیرو)')}</div></div>
 <div class=c><h3>مشخصات نمونه‌ها</h3><div class=g>${inp('com|D','قطر مشترک (mm)')}${inp('com|H','ارتفاع مشترک (mm)')}${inp('com|Gs','Gs (اختیاری)')}</div>
 <table style="margin-top:6px"><tr><th></th>${[1,2,3].map(i=>`<th style="color:${COL[i-1]}">نمونه ${i}</th>`).join('')}</tr>
 ${rows.map(([k,l])=>`<tr><td>${l}</td>${[0,1,2].map(i=>`<td><input data-p="sp|${i}|${k}" inputmode="decimal" value="${S.sp[i][k]??''}" ${'DH'.includes(k)?'placeholder="مشترک"':''}></td>`).join('')}</tr>`).join('')}</table></div>
 <div class=c><h3>قرائت‌ها</h3><div class=sc><table><tr><th>ΔL<br>(mm)</th>${[0,1,2].map(i=>`<th style="color:${COL[i]}">نمونه ${i+1}<br>${ring?'قرائت (div)':'نیرو ('+S.ld.u+')'}</th>`).join('')}</tr>
 ${ROWS.map(dl=>`<tr><td><b>${dl}</b></td>${[0,1,2].map(i=>`<td><input data-p="rd|${dl}_${i}" data-dl="${dl}" data-i="${i}" inputmode="decimal" value="${S.rd[dl+'_'+i]??''}"></td>`).join('')}</tr>`).join('')}</table></div></div>
 <div class=c><h3>نتایج</h3><div id=sum></div><details><summary>جدول محاسبات</summary><div id=det class=sc></div></details>
 <canvas id=c1></canvas><canvas id=c2></canvas><button id=bp>چاپ / ذخیره PDF</button><button id=bs>اشتراک‌گذاری</button></div>`;
 $('bp').onclick=()=>out(0);$('bs').onclick=()=>out(1);update()}
function update(){
 const R=METHODS[S.method].calc(),sp=R.sp;
 document.querySelectorAll('[data-dl]').forEach(e=>{const H=sp[e.dataset.i].H;e.disabled=!!H&&e.dataset.dl/H>.13+1e-9});
 const u=S.unit,lines=[['σ3 ('+u+')',s=>fp(s.s3)],['ε گسیختگی (%)',s=>s.pk?f(s.pk.e*100,2):'—'],['σd,max ('+u+')',s=>s.sdf!=null?fp(s.sdf):'—'],['σ1f ('+u+')',s=>s.s1!=null?fp(s.s1):'—'],['Su=σd/2 ('+u+')',s=>s.su!=null?fp(s.su):'—'],
  ['γ مرطوب (g/cm³)',s=>f(s.g,3)],['γ خشک (g/cm³)',s=>f(s.gd,3)],['e',s=>f(s.e,3)],['S (%)',s=>f(s.S,1)]];
 R.lines=lines;
 $('sum').innerHTML='<table><tr><th></th>'+[1,2,3].map(i=>`<th>نمونه ${i}</th>`).join('')+'</tr>'+lines.map(([l,g])=>`<tr><td style="position:static">${l}</td>${sp.map(s=>`<td>${g(s)}</td>`).join('')}</tr>`).join('')+'</table>'
 +`<p><b>c<sub>u</sub> = ${isFinite(R.c)?fp(R.c)+' '+u:'—'}</b> &nbsp; <b>φ<sub>u</sub> = ${isFinite(R.phi)?f(R.phi*180/Math.PI,1)+'°':'—'}</b></p>`;
 $('det').innerHTML='<table class=r><tr><th>ΔL (mm)</th>'+[1,2,3].map(i=>`<th>ε% #${i}</th><th>P (kN) #${i}</th><th>σd (${u}) #${i}</th>`).join('')+'</tr>'+
  ROWS.map(dl=>'<tr><td>'+dl+'</td>'+sp.map(s=>{const p=s.pts.find(q=>q.dl==dl);return p?`<td>${f(p.e*100,2)}</td><td>${f(p.P/1000,3)}</td><td>${fp(p.sd)}</td>`:'<td></td><td></td><td></td>'}).join('')+'</tr>').join('')+'</table>';
 const d=devicePixelRatio||1,W=$('c1').parentNode.clientWidth-16;
 [['c1',chartSS,.75],['c2',chartMohr,.85]].forEach(([id,fn,r])=>{const cv=$(id);cv.width=W*d;cv.height=W*r*d;const c=cv.getContext('2d');c.scale(d,d);c.fillStyle='#fff';c.fillRect(0,0,W,W*r);fn(c,0,0,W,W*r,R,Math.max(10,W/38))});
 return R}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.p;if(!p)return;sp_(p,t.tagName==='SELECT'?t.value:t.value);save();if(t.tagName==='SELECT'&&(p==='dev|ring'))S.dev.ring=+t.value;if(t.dataset.r)render();else update()});
document.addEventListener('click',e=>{const a=e.target.dataset.a;if(a==='add'){S.rings.push({n:'رینگ '+(S.rings.length+1),k:1,u:'kg',r:1});S.dev.ring=S.rings.length-1;save();render()}
 if(a==='del'&&S.rings.length>1&&confirm('رینگ حذف شود؟')){S.rings.splice(S.dev.ring,1);S.dev.ring=0;save();render()}});

/* ===== Print sheet -> PDF (offline, no libs) ===== */
function sheet(R){
 const cv=document.createElement('canvas'),Z=2;cv.width=794*Z;cv.height=1123*Z;const c=cv.getContext('2d');c.scale(Z,Z);c.fillStyle='#fff';c.fillRect(0,0,794,1123);
 c.fillStyle='#000';c.direction='rtl';c.textAlign='right';c.font='bold 18px Tahoma';c.fillText('آزمایش سه‌محوری UU',772,34);
 c.font='12px Tahoma';const I=S.info,dev=R.rg?'رینگ '+R.rg.n+' (ضریب '+R.rg.k+' '+R.rg.u+')':'لودسل دیجیتال ('+S.ld.u+')';
 c.fillText('پروژه: '+(I.proj||'')+'    شناسه نمونه: '+(I.id||'')+'    تاریخ: '+(I.date||'')+'    آزمایشگر: '+(I.op||''),772,58);
 c.fillText('روش: UU (حجم ثابت، اشباع در مرحله برش)    دستگاه: '+dev,772,76);
 const L=R.lines.concat([['D (mm)',s=>f(s.D,1)],['H (mm)',s=>f(s.H,1)],['w (%)',s=>f(s.w,1)]]),cw=[220,140,140,140],x0=72,rh=17;let y=90;
 const row=(t,b)=>{let x=x0+640;t.forEach((s,j)=>{c.strokeRect(x-cw[j],y,cw[j],rh);c.textAlign='center';c.font=(b?'bold ':'')+'11px Tahoma';c.fillText(s,x-cw[j]/2,y+12);x-=cw[j]});y+=rh};
 c.strokeStyle='#000';c.lineWidth=.7;row(['مشخصه','نمونه ۱','نمونه ۲','نمونه ۳'],1);L.forEach(([l,g])=>row([l].concat(R.sp.map(g))));
 c.textAlign='right';c.font='bold 13px Tahoma';c.fillText('c_u = '+(isFinite(R.c)?fp(R.c)+' '+S.unit:'—')+'      φ_u = '+(isFinite(R.phi)?f(R.phi*180/Math.PI,1)+'°':'—'),772,y+20);
 chartSS(c,77,y+34,640,270,R,11);chartMohr(c,77,y+314,640,1105-y-314,R,11);return cv}
function pdfFrom(cv){const j=atob(cv.toDataURL('image/jpeg',.92).split(',')[1]),img=Uint8Array.from(j,c=>c.charCodeAt(0)),W=595.28,H=841.89,parts=[],offs=[],te=new TextEncoder();let len=0;
 const add=x=>{const b=typeof x==='string'?te.encode(x):x;parts.push(b);len+=b.length};
 const obj=(n,body,st)=>{offs[n]=len;add(n+' 0 obj\n'+body+(st?'\nstream\n':'\n'));if(st){add(st);add('\nendstream\n')}add('endobj\n')};
 add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
 obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
 obj(4,`<</Type/XObject/Subtype/Image/Width ${cv.width}/Height ${cv.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${img.length}>>`,img);
 const cs=`q ${W} 0 0 ${H} 0 0 cm /I Do Q`;obj(5,`<</Length ${cs.length}>>`,cs);const xr=len;
 add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'})}
async function out(share){
 const R=update(),blob=pdfFrom(sheet(R)),name='triaxial_UU_'+(S.info.id||Date.now())+'.pdf',P=window.NativePlugins;
 try{
  if(P&&P.Filesystem){const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(blob)});
   const w=await P.Filesystem.writeFile({path:name,data:b64,directory:share?'CACHE':'DOCUMENTS',recursive:true});
   if(share&&P.Share)await P.Share.share({title:name,url:w.uri,dialogTitle:'ارسال برگه نتیجه'});else if(!share)alert('ذخیره شد: Documents/'+name);return}
  const file=new File([blob],name,{type:'application/pdf'});
  if(share&&navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:name});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()
 }catch(e){alert('خطا: '+e.message)}}
render();
</script>
 
<script type="module">
import { Filesystem } from '@capacitor/filesystem';
import { Share } from '@capacitor/share';

window.NativePlugins = {
  Filesystem,
  Share
};
</script>

</body></html>
